<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>F2 CET P.36-37 Practice</title>
  <style>
    :root {
      --primary-color: #3b82f6;
      --primary-hover: #2563eb;
      --secondary-color: #60a5fa;
      --accent-color: #93c5fd;
      --success-color: #10b981;
      --danger-color: #ef4444;
      --bg-gradient: linear-gradient(135deg, #eff6ff 0%, #dbeafe 50%, #e0e7ff 100%);
      --card-bg: rgba(255, 255, 255, 0.94);
      --text-color: #1e293b;
      --border-radius: 24px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Comic Sans MS", "Chalkboard SE", "YuGothic", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    body { 
      background: var(--bg-gradient); 
      background-attachment: fixed;
      color: var(--text-color);
      max-width: 600px; 
      margin: 0 auto; 
      padding: 18px 15px;
      min-height: 100vh;
    }

    h1 { 
      text-align: center; 
      font-size: 2rem; 
      margin-bottom: 20px; 
      color: #2563eb;
      text-shadow: 2px 2px 0px #ffffff, 4px 4px 0px #bfdbfe;
      letter-spacing: 1px;
    }

    h2 { 
      font-size: 1.15rem; 
      margin-bottom: 14px; 
      color: #2563eb; 
      border-bottom: 2px dashed #bfdbfe; 
      padding-bottom: 8px; 
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-box {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 3px solid #ffffff;
      border-radius: var(--border-radius);
      padding: 22px;
      box-shadow: 0 10px 25px rgba(59, 130, 246, 0.15);
      margin-bottom: 18px;
    }

    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-weight: bold; margin-bottom: 8px; font-size: 0.95rem; color: #1e3a8a; }
    .form-group input, .form-group select {
      width: 100%;
      padding: 12px 16px;
      background: #f0f9ff;
      border: 2px solid #bfdbfe;
      border-radius: 16px;
      font-size: 0.95rem;
      color: #1e293b;
      outline: none;
      transition: all 0.25s ease;
      font-weight: bold;
    }
    .form-group input:focus, .form-group select:focus { 
      border-color: var(--primary-color); 
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.2);
    }

    .mode-selector { display: flex; gap: 8px; margin-top: 5px; }
    .mode-btn {
      flex: 1;
      padding: 12px 5px;
      border: 2px solid #bfdbfe;
      background: #f0f9ff;
      color: #1e40af;
      border-radius: 16px;
      font-weight: bold;
      font-size: 0.88rem;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
      box-shadow: 0 4px 0 #93c5fd;
    }
    .mode-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #93c5fd;
    }
    .mode-btn.active {
      border-color: #2563eb;
      background: #dbeafe;
      color: #1e3a8a;
      box-shadow: 0 4px 0 #60a5fa;
    }

    .start-btn {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #60a5fa 0%, #a5b4fc 100%);
      color: #1e1b4b;
      border: 3px solid #ffffff;
      border-radius: 20px;
      font-size: 1.15rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.15s ease;
      box-shadow: 0 6px 0 #3b82f6, 0 10px 15px rgba(59, 130, 246, 0.25);
      margin-top: 8px;
    }
    .start-btn:active { 
      transform: translateY(4px); 
      box-shadow: 0 2px 0 #3b82f6, 0 5px 10px rgba(59, 130, 246, 0.25);
    }

    .leaderboard-table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 0.9rem; text-align: center; }
    .leaderboard-table th, .leaderboard-table td { padding: 10px 4px; border-bottom: 2px dashed #e0e7ff; }
    .leaderboard-table th { background-color: #f0f9ff; color: #1e40af; border-radius: 8px; }
    .leaderboard-table tr:nth-child(1) td { font-weight: bold; color: #d97706; }
    .leaderboard-table tr:nth-child(2) td { font-weight: bold; color: #64748b; }
    .leaderboard-table tr:nth-child(3) td { font-weight: bold; color: #b45309; }

    #game-view { display: none; }

    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .home-btn {
      padding: 8px 16px;
      background: #ffffff;
      border: 2px solid #bfdbfe;
      border-radius: 14px;
      color: #1e40af;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 3px 0 #93c5fd;
      transition: all 0.15s ease;
    }
    .home-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #93c5fd; }

    .status-bar {
      display: flex;
      justify-content: space-between;
      background: #ffffff;
      border: 3px solid #bfdbfe;
      color: #1e293b;
      padding: 12px 18px;
      border-radius: 20px;
      margin-bottom: 18px;
      font-size: 0.95rem;
      font-weight: bold;
      box-shadow: 0 4px 10px rgba(59, 130, 246, 0.1);
    }

    .word-prompt { font-size: 1.2rem; margin-bottom: 12px; font-weight: bold; text-align: center; line-height: 1.5; color: #1e293b; }
    .phonetic { color: #2563eb; font-size: 1.05rem; margin-bottom: 14px; text-align: center; font-family: "Lucida Sans Unicode", "Arial Unicode MS", sans-serif; font-weight: 600; }

    .letters-container { display: flex; justify-content: center; gap: 8px; margin: 20px 0; flex-wrap: wrap; cursor: pointer; pointer-events: none; }
    .letter-box { width: 36px; height: 46px; border-bottom: 4px solid #bfdbfe; font-size: 1.4rem; font-weight: bold; text-align: center; line-height: 46px; text-transform: lowercase; color: #1e293b; border-radius: 6px; }
    .letter-box.active { border-bottom-color: var(--primary-color); background: #dbeafe; }
    .letter-box.correct { border-bottom-color: var(--success-color); color: #15803d; background: #f0fdf4; }
    .letter-box.wrong { border-bottom-color: var(--danger-color); color: var(--danger-color); background: #fef2f2; }

    #spelling-area { position: relative; min-height: 80px; }
    #hidden-input { 
      position: absolute; 
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%; 
      opacity: 0.01; 
      z-index: 10; 
      border: none;
      background: transparent;
      color: transparent;
      cursor: default;
    }

    .options-grid { display: grid; grid-template-columns: 1fr; gap: 12px; margin-top: 15px; }
    .option-btn { 
      padding: 14px; 
      border: 2px solid #bfdbfe; 
      border-radius: 16px; 
      background: #ffffff; 
      color: #1e293b;
      font-size: 0.95rem; 
      font-weight: 600;
      text-align: left; 
      cursor: pointer; 
      transition: all 0.2s ease;
      box-shadow: 0 3px 0 #93c5fd;
      position: relative;
      z-index: 10;
    }
    .option-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #93c5fd; }
    .option-btn.correct { background: #dcfce7; color: #166534; border-color: #86efac; box-shadow: 0 3px 0 #4ade80; }
    .option-btn.wrong { background: #ffe4e6; color: #9f1239; border-color: #fca5a5; box-shadow: 0 3px 0 #f87171; }

    .nav-control { display: flex; gap: 10px; margin-top: 18px; position: relative; z-index: 10; }
    .btn { 
      flex: 1; 
      padding: 12px; 
      border: none; 
      border-radius: 16px; 
      background: #94a3b8; 
      color: white; 
      font-weight: bold; 
      cursor: pointer; 
      text-align: center;
      box-shadow: 0 4px 0 #64748b;
      transition: all 0.15s ease;
    }
    .btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #64748b; }
    .btn-primary { background: #3b82f6; box-shadow: 0 4px 0 #1d4ed8; }
    .btn-primary:active { box-shadow: 0 2px 0 #1d4ed8; }
    .btn-danger { background: #f97316; box-shadow: 0 4px 0 #c2410c; }
    .btn-danger:active { box-shadow: 0 2px 0 #c2410c; }
    .btn-success { background: #10b981; box-shadow: 0 4px 0 #047857; }
    .btn-success:active { box-shadow: 0 2px 0 #047857; }

    .speaker-btn { 
      background: #dbeafe; 
      border: 2px solid #93c5fd; 
      border-radius: 50%;
      width: 38px;
      height: 38px;
      font-size: 1.1rem; 
      cursor: pointer; 
      vertical-align: middle; 
      margin-left: 8px; 
      position: relative; 
      z-index: 20; 
      transition: transform 0.2s;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .speaker-btn:active { transform: scale(0.9); }

    .answer-display { 
      margin-top: 15px; 
      padding: 14px; 
      background: #eff6ff; 
      border: 2px dashed #93c5fd; 
      color: #1e40af; 
      border-radius: 16px; 
      font-size: 0.95rem; 
      display: none; 
      line-height: 1.5; 
      font-weight: 600;
      position: relative;
      z-index: 10;
    }

    .mistake-item {
      background: #ffffff;
      border: 2px solid #bfdbfe;
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 10px;
      text-align: left;
    }
    .mistake-word { font-weight: bold; color: #2563eb; font-size: 1.1rem; }
    .mistake-cn { color: #475569; font-size: 0.95rem; margin-top: 4px; }
    .clear-btn {
      font-size: 0.8rem;
      padding: 4px 10px;
      background: #dbeafe;
      color: #1e40af;
      border: 1px solid #93c5fd;
      border-radius: 10px;
      cursor: pointer;
    }

    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); backdrop-filter: blur(6px); justify-content: center; align-items: center; z-index: 100; }
    .modal-content { background: #ffffff; border: 4px solid #bfdbfe; padding: 28px; border-radius: 28px; width: 90%; max-width: 400px; text-align: center; color: #1e293b; box-shadow: 0 20px 30px rgba(0,0,0,0.15); }
  </style>
</head>
<body>

  <!-- ==================== 首頁大廳 (LOBBY) ==================== -->
  <div id="lobby-view">
    <h1>🎮 F2 CET P.36-37</h1>

    <div class="card-box">
      <h2><span>👤 挑戰者資訊與模式選擇</span></h2>
      <div class="form-group">
        <label>姓名：</label>
        <input type="text" id="player-name" placeholder="請輸入姓名 (例如: 張小明)">
      </div>
      <div class="form-group">
        <label>班號：</label>
        <input type="text" id="player-seat" placeholder="請輸入班號 (例如: 01)">
      </div>

      <div class="form-group">
        <label>練習模式：</label>
        <div class="mode-selector">
          <button type="button" class="mode-btn active" onclick="selectMode('spelling', this)">聽寫拼字</button>
          <button type="button" class="mode-btn" onclick="selectMode('matching', this)">中文配對</button>
          <button type="button" class="mode-btn" onclick="selectMode('sentence', this)">例句填空</button>
        </div>
      </div>

      <div class="form-group">
        <label>單詞範圍：</label>
        <select id="group-select" onchange="fetchLeaderboard()">
          <option value="p.36">p.36 (campus ~ award，共 12 題)</option>
          <option value="p.37">p.37 (grant ~ tutor，共 11 題)</option>
          <option value="全部">全部 (p.36-37 隨機抽 10 題)</option>
        </select>
      </div>

      <button type="button" class="start-btn" onclick="startGame()">🚀 開始挑戰 (進入計時)</button>
    </div>

    <div class="card-box">
      <h2>
        <span>🏆 即時排行榜</span>
        <button type="button" class="clear-btn" style="color:#1e40af; background:#dbeafe; border-color:#93c5fd;" onclick="fetchLeaderboard()">🔄 重新整理</button>
      </h2>
      <table class="leaderboard-table">
        <thead>
          <tr>
            <th>排名</th>
            <th>姓名(班號)</th>
            <th>得分</th>
            <th>用時</th>
          </tr>
        </thead>
        <tbody id="lobby-leaderboard-body"></tbody>
      </table>
    </div>

    <div class="card-box">
      <h2>
        <span>📕 累積錯題本</span>
        <button type="button" class="clear-btn" onclick="clearMistakes()">清空錯題本</button>
      </h2>
      <div id="mistakes-container"></div>
    </div>
  </div>


  <!-- ==================== 遊戲挑戰頁面 (GAME) ==================== -->
  <div id="game-view">
    <div class="top-nav">
      <button type="button" class="home-btn" onclick="confirmBackToLobby()">🏠 返回首頁</button>
    </div>

    <div class="status-bar">
      <span id="player-tag">玩家: --</span>
      <span id="timer-text">⏱️ 00:00</span>
      <span id="progress-text">1 / 10</span>
    </div>

    <div class="card-box" id="main-card-box" onclick="focusInput()">
      <div id="prompt-area" class="word-prompt">載入中...</div>
      <div id="phonetic-area" class="phonetic"></div>

      <div id="spelling-area">
        <div id="letters-container" class="letters-container"></div>
        <input type="text" id="hidden-input" autocomplete="off" autocapitalize="off" spellcheck="false">
      </div>

      <div id="options-area" class="options-grid" style="display: none;"></div>

      <div id="answer-display" class="answer-display"></div>
    </div>

    <div class="nav-control">
      <button type="button" class="btn btn-danger" onclick="showAnswer()">💡 答案</button>
      <button type="button" class="btn" id="prev-btn" onclick="prevQuestion()">⬅️ 上一題</button>
      <button type="button" class="btn btn-primary" id="next-btn" onclick="nextQuestion()">下一題 ➡️</button>
      <button type="button" class="btn btn-success" id="submit-btn" style="display: none;" onclick="finishGame()">🏁 完成結算</button>
    </div>
  </div>


  <div id="result-modal" class="modal">
    <div class="modal-content">
      <h2 style="justify-content: center; font-size: 1.5rem;">🎉 挑戰完成！</h2>
      <p id="result-desc" style="margin: 18px 0; font-size: 1.15rem; font-weight: bold; color: #1e293b;"></p>
      <p id="upload-status" style="font-size: 0.9rem; color: #64748b; margin-bottom: 18px;">成績上傳中...</p>
      <button type="button" class="start-btn" onclick="backToLobby()">返回首頁</button>
    </div>
  </div>


  <script>

      { id: 5, page: "p.36", word: "platform", phonetic: "/ˈplætfɔːm/", cn: "平台；講台；站台", a2_sentence: "The fast train is arriving soon, so passengers are waiting quietly on ______ 2 with their bags.", sentence_cn: "快車即將到達，所以乘客們拿著包包在 2 號站台安靜地等待。", sentence_hint: "快車即將到達，所以乘客們拿著包包在 2 號 ______ 安靜地等待。" },

      { id: 8, page: "p.36", word: "degree", phonetic: "/dɪˈɡriː/", cn: "學位；程度；度", a2_sentence: "After studying hard at university for four years, my sister finally got her bachelor's ______.", sentence_cn: "在大學努力學習了四年後，我姐姐終於拿到了她的學士學位。", sentence_hint: "在大學努力學習了四年後，我姐姐終於拿到了她的學士 ______。" },

      { id: 10, page: "p.36", word: "procedure", phonetic: "/prəˈsiːdʒə/", cn: "程序；手續；步驟", a2_sentence: "Before you do a chemistry experiment, you must follow every safety step and ______ carefully.", sentence_cn: "在做化學實驗前，你必須仔細遵循每一個安全步驟與程序。", sentence_hint: "在做化學實驗前，你必須仔細遵循每一個安全步驟與 ______。" },
      { id: 11, page: "p.36", word: "phase", phonetic: "/feɪz/", cn: "階段；時期", a2_sentence: "Learning a new language has different parts, and the first ______ is to remember basic words.", sentence_cn: "學習一門新語言有不同的階段，而第一個階段就是記住基礎單字。", sentence_hint: "學習一門新語言有不同的 ______，而第一個 ______ 就是記住基礎單字。" },

      { id: 13, page: "p.37", word: "grant", phonetic: "/ɡrɑːnt/", cn: "承認；給予；撥款", a2_sentence: "Although the homework is long, I ______ that it helps us learn many useful things.", sentence_cn: "雖然作業很長，但我承認它確實幫助我們學到了許多有用的知識。", sentence_hint: "雖然作業很長，但我 ______ 它確實幫助我們學到了許多有用的知識。" },
      { id: 14, page: "p.37", word: "grade", phonetic: "/ɡreɪd/", cn: "等級；成績；給……分等級", a2_sentence: "Peter was very happy because he worked hard and got a high ______ on his English test.", sentence_cn: "彼得非常高興，因為他努力學習並在他的英語測驗中得到了高分成績。", sentence_hint: "彼得非常高興，因為他努力學習並在他的英語測驗中得到了高分 ______。" },
      { id: 15, page: "p.37", word: "library", phonetic: "/ˈlaɪbrəri/", cn: "圖書館；藏書", a2_sentence: "Students go to the quiet school ______ to borrow storybooks and study after class.", sentence_cn: "學生們下課後會去安靜的學校圖書館借故事書和自習。", sentence_hint: "學生們下課後會去安靜的學校 ______ 借故事書和自習。" },
      { id: 16, page: "p.37", word: "laboratory", phonetic: "/ləˈbɒrətri/", cn: "實驗室", a2_sentence: "In science class, we wear safety glasses and do fun chemical tests in the ______.", sentence_cn: "在科學課上，我們戴上安全護目鏡並在實驗室裡做有趣的化學測試。", sentence_hint: "在科學課上，我們戴上安全護目鏡並在 ______ 裡做有趣的化學測試。" },
      { id: 17, page: "p.37", word: "cafeteria", phonetic: "/ˌkæfəˈtɪəriə/", cn: "自助食堂", a2_sentence: "At 12 o'clock, all students go to the school ______ to buy hot lunch and drink juice.", sentence_cn: "十二點時，所有學生都去學校自助食堂買熱騰騰的午餐和喝果汁。", sentence_hint: "十二點時，所有學生都去學校 ______ 買熱騰騰的午餐和喝果汁。" },
      { id: 18, page: "p.37", word: "dorm", phonetic: "/dɔːm/", cn: "宿舍", a2_sentence: "Because his house is far away from the university, he sleeps and lives in a student ______.", sentence_cn: "因為他的家離大學很遠，所以他睡在並住在學生宿舍裡。", sentence_hint: "因為他的家離大學很遠，所以他睡在並住在學生 ______ 裡。" },
      { id: 19, page: "p.37", word: "headmaster", phonetic: "/ˌhedˈmɑːstə/", cn: "男校長", a2_sentence: "Every Monday morning, our ______ stands in front of the school to welcome all students.", sentence_cn: "每星期一早上，我們的男校長都會站在學校門口歡迎所有學生。", sentence_hint: "每星期一早上，我們的 ______ 都會站在學校門口歡迎所有學生。" },
      { id: 20, page: "p.37", word: "professor", phonetic: "/prəˈfesə/", cn: "教授", a2_sentence: "Dr. Smith is a smart ______ who teaches advanced math classes at the university.", sentence_cn: "史密斯博士是一位聰明的教授，在大學校園裡教高階數學課。", sentence_hint: "史密斯博士是一位聰明的 ______，在大學校園裡教高階數學課。" },
      { id: 21, page: "p.37", word: "instructor", phonetic: "/ɪnˈstrʌktə/", cn: "指導員；教練；講師", a2_sentence: "Before we jumped into the deep water, the swimming ______ taught us how to breathe safely.", sentence_cn: "在我們跳進深水前，游泳教練教我們如何安全地呼吸。", sentence_hint: "在我們跳進深水前，游泳 ______ 教我們如何安全地呼吸。" },
      { id: 22, page: "p.37", word: "assistant", phonetic: "/əˈsɪstənt/", cn: "助手；助理", a2_sentence: "The teacher was busy, so her teaching ______ helped her clean the board and pass out test papers.", sentence_cn: "老師很忙，所以她的教學助手幫忙擦黑板和發試卷。", sentence_hint: "老師很忙，所以她的教學 ______ 幫忙擦黑板和發試卷。" },
      { id: 23, page: "p.37", word: "tutor", phonetic: "/ˈtjuːtə/", cn: "家庭教師；導師", a2_sentence: "When I could not understand math problems at school, my parents hired a private ______ to teach me at home.", sentence_cn: "當我在學校聽不懂數學題時，我父母請了一位私人家教在家里教我。", sentence_hint: "當我在學校聽不懂數學題時，我父母請了一位私人 ______ 在家里教我。" }
    ];

    let selectedMode = 'spelling';
    let quizList = [];
    let quizListOptions = [];
    let currentIndex = 0;
    let userAnswers = {};

    let timerInterval = null;
    let secondsElapsed = 0;

    let globalLeaderboard = [];
    let localMistakes = JSON.parse(localStorage.getItem('f2_cet_p3637_mistakes') || '[]');

    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxIvQt-N6L0ocGYVXLuzlPAyc_hCtfp-0lqBLdIMttt2ph2MzAQoPJVdBnIq2mI4zoG3w/exec";

    let synth = window.speechSynthesis;
    let dictionaryVoice = null;

    function initVoices() {
      if ('speechSynthesis' in window) {
        let voices = synth.getVoices();
        dictionaryVoice = voices.find(v => v.lang.startsWith('en') && (v.name.includes('Google') || v.name.includes('Samantha') || v.name.includes('Daniel') || v.name.includes('Natural') || v.name.includes('Premium'))) 
                          || voices.find(v => v.lang.startsWith('en-US')) 
                          || voices.find(v => v.lang.startsWith('en'));
      }
    }

    if ('speechSynthesis' in window) {
      speechSynthesis.onvoiceschanged = initVoices;
      initVoices();
    }

    window.onload = function() {
      fetchLeaderboard();
      renderMistakes();
      setupSpellingInputListener();
    };

    function selectMode(mode, btnElem) {
      selectedMode = mode;
      document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
      btnElem.classList.add('active');
      renderLobbyLeaderboard();
    }

    function shuffleArray(arr) {
      let a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function fetchLeaderboard() {
      const tbody = document.getElementById('lobby-leaderboard-body');
      tbody.innerHTML = `<tr><td colspan="4" style="color:#64748b; padding:12px;">⏳ 排行榜同步中...</td></tr>`;

      fetch(GOOGLE_SCRIPT_URL, { method: 'GET', redirect: 'follow' })
      .then(res => {
        if (!res.ok) throw new Error("網路回應不正常");
        return res.json();
      })
      .then(data => {
        globalLeaderboard = data;
        renderLobbyLeaderboard();
      })
      .catch(err => {
        console.error("雲端數據加載失敗:", err);
        tbody.innerHTML = `<tr><td colspan="4" style="color:#ef4444; padding:12px;">⚠️ 排行榜載入失敗，請檢查網路或 URL 設定</td></tr>`;
      });
    }

    function renderLobbyLeaderboard() {
      const tbody = document.getElementById('lobby-leaderboard-body');
      tbody.innerHTML = '';

      const selectedGroupVal = document.getElementById('group-select').value.trim(); 
      const modeTextMap = { 'spelling': '聽寫拼字', 'matching': '中文配對', 'sentence': '例句填空' };
      const currentModeText = modeTextMap[selectedMode];

      function parseRangeKey(str) {
        if (!str) return 'all';
        let s = String(str).toLowerCase().replace(/\s+/g, '');
        if (s.includes('36-37') || s.includes('全') || s.includes('all')) return 'all';
        if (s.includes('36')) return 'p.36';
        if (s.includes('37')) return 'p.37';
        return 'all';
      }

      const targetGroupKey = parseRangeKey(selectedGroupVal);

      const filtered = globalLeaderboard.filter(i => {
        const itemGroupKey = parseRangeKey(i.group);
        const isGroupMatch = (itemGroupKey === targetGroupKey);
        
        const itemMode = String(i.mode || '').replace(/\s+/g, '').toLowerCase();
        const targetMode = currentModeText.replace(/\s+/g, '').toLowerCase();
        const isModeMatch = (itemMode === targetMode) || (itemMode === selectedMode.toLowerCase());

        return isGroupMatch && isModeMatch;
      });

      filtered.sort((a, b) => {
        if (Number(b.score) !== Number(a.score)) {
          return Number(b.score) - Number(a.score);
        }
        return Number(a.time) - Number(b.time);
      });

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" style="color:#94a3b8; padding:12px;">該分類無紀錄，成為第一個挑戰者吧！</td></tr>`;
        return;
      }

      filtered.slice(0, 10).forEach((item, index) => {
        const tr = document.createElement('tr');
        let badge = index + 1;
        if (index === 0) badge = '🥇 1';
        else if (index === 1) badge = '🥈 2';
        else if (index === 2) badge = '🥉 3';

        tr.innerHTML = `
          <td>${badge}</td>
          <td>${item.name} (${item.seat})</td>
          <td><b>${item.score}</b> 分</td>
          <td>${formatTime(Number(item.time))}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    function renderMistakes() {
      const container = document.getElementById('mistakes-container');
      container.innerHTML = '';

      if (localMistakes.length === 0) {
        container.innerHTML = `<p style="color:#94a3b8; text-align:center; padding:10px;">目前沒有錯題紀錄，繼續保持！👍</p>`;
        return;
      }

      localMistakes.forEach((item) => {
        const div = document.createElement('div');
        div.className = 'mistake-item';
        div.innerHTML = `
          <div class="mistake-word">${item.word} <span style="font-size:0.85rem; color:#2563eb; font-weight:normal;">${item.phonetic}</span> <button type="button" class="speaker-btn" style="width:28px;height:28px;font-size:0.8rem;" onclick="speakWord('${item.word}')">🔊</button></div>
          <div class="mistake-cn">${item.cn}</div>
        `;
        container.appendChild(div);
      });
    }

    function clearMistakes() {
      if (confirm('確定要清空錯題本嗎？')) {
        localMistakes = [];
        localStorage.setItem('f2_cet_p3637_mistakes', JSON.stringify([]));
        renderMistakes();
      }
    }

    function addMistake(item) {
      if (!localMistakes.some(m => m.id === item.id)) {
        localMistakes.push(item);
        localStorage.setItem('f2_cet_p3637_mistakes', JSON.stringify(localMistakes));
      }
    }

    function startGame() {
      const name = document.getElementById('player-name').value.trim();
      const seat = document.getElementById('player-seat').value.trim();

      if (!name || !seat) {
        alert('請先輸入姓名與班號！');
        return;
      }

      const groupVal = document.getElementById('group-select').value;
      
      if (groupVal === "p.36") {
        quizList = shuffleArray(rawData.filter(d => d.page === "p.36"));
      } else if (groupVal === "p.37") {
        quizList = shuffleArray(rawData.filter(d => d.page === "p.37"));
      } else {
        quizList = shuffleArray([...rawData]).slice(0, 10);
      }

      quizListOptions = [];

      quizList.forEach(item => {
        const key = selectedMode === 'matching' ? 'cn' : 'word';
        let options = [item[key]];
        let otherPool = rawData.filter(d => d.id !== item.id).map(d => d[key]);
        options = options.concat(shuffleArray(otherPool).slice(0, 3));
        quizListOptions.push(shuffleArray(options));
      });

      currentIndex = 0;
      userAnswers = {};

      document.getElementById('player-tag').innerText = `👤 ${name} (${seat}號)`;
      document.getElementById('lobby-view').style.display = 'none';
      document.getElementById('game-view').style.display = 'block';

      startTimer();
      loadQuestion(true);
    }

    function startTimer() {
      clearInterval(timerInterval);
      secondsElapsed = 0;
      timerInterval = setInterval(() => {
        secondsElapsed++;
        document.getElementById('timer-text').innerText = `⏱️ ${formatTime(secondsElapsed)}`;
      }, 1000);
    }

    function formatTime(secs) {
      const m = String(Math.floor(secs / 60)).padStart(2, '0');
      const s = String(secs % 60).padStart(2, '0');
      return `${m}:${s}`;
    }

    function loadQuestion(shouldSpeak = true) {
      document.getElementById('answer-display').style.display = 'none';
      const item = quizList[currentIndex];

      if (selectedMode !== 'sentence' && shouldSpeak) {
        speakWord(item.word);
      } else if (selectedMode === 'sentence') {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
        }
      }

      document.getElementById('progress-text').innerText = `${currentIndex + 1} / ${quizList.length}`;
      document.getElementById('prev-btn').style.visibility = currentIndex === 0 ? 'hidden' : 'visible';
      
      const submitBtn = document.getElementById('submit-btn');
      const nextBtn = document.getElementById('next-btn');

      if (currentIndex === quizList.length - 1) {
        nextBtn.style.display = 'none';
        submitBtn.style.display = 'block';
      } else {
        nextBtn.style.display = 'block';
        submitBtn.style.display = 'none';
      }

      const spellingArea = document.getElementById('spelling-area');
      const optionsArea = document.getElementById('options-area');

      if (selectedMode === 'spelling') {
        spellingArea.style.display = 'block';
        optionsArea.style.display = 'none';

        document.getElementById('prompt-area').innerHTML = `${item.cn} <button type="button" class="speaker-btn" onclick="event.stopPropagation(); speakWord('${item.word}')">🔊</button>`;
        document.getElementById('phonetic-area').innerText = item.phonetic;

        const container = document.getElementById('letters-container');
        container.innerHTML = '';
        const savedVal = userAnswers[currentIndex] || '';

        const input = document.getElementById('hidden-input');
        if (input) {
          input.value = savedVal;
        }

        for (let i = 0; i < item.word.length; i++) {
          const box = document.createElement('div');
          box.className = 'letter-box';
          if (savedVal[i]) box.innerText = savedVal[i];
          container.appendChild(box);
        }

        refreshSpellingUI(savedVal, item.word);
        
        // 自動聚焦輸入框
        setTimeout(focusInput, 50);

      } else if (selectedMode === 'matching') {
        spellingArea.style.display = 'none';
        optionsArea.style.display = 'grid';

        document.getElementById('prompt-area').innerHTML = `${item.word} <button type="button" class="speaker-btn" onclick="event.stopPropagation(); speakWord('${item.word}')">🔊</button>`;
        document.getElementById('phonetic-area').innerText = item.phonetic;

        renderOptions('cn');

      } else if (selectedMode === 'sentence') {
        spellingArea.style.display = 'none';
        optionsArea.style.display = 'grid';

        document.getElementById('prompt-area').innerHTML = `
          <div style="text-align: left; line-height: 1.6; font-size: 1.15rem;">${item.a2_sentence}</div>
          <div style="font-size: 0.95rem; color: #1e40af; margin-top: 12px; background: #eff6ff; padding: 10px 14px; border-radius: 12px; border: 1px dashed #93c5fd; text-align: left; font-weight: normal;">
            💡 <b>句意提示：</b> ${item.sentence_hint || item.sentence_cn}
          </div>
        `;
        document.getElementById('phonetic-area').innerText = "";

        renderOptions('word');
      }
    }

    function renderOptions(key) {
      const container = document.getElementById('options-area');
      container.innerHTML = '';

      const options = quizListOptions[currentIndex] || [];
      const currentItem = quizList[currentIndex];
      const savedAns = userAnswers[currentIndex];

      options.forEach(opt => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'option-btn';
        btn.innerText = opt;

        if (savedAns) {
          if (opt === currentItem[key]) btn.classList.add('correct');
          if (opt === savedAns && opt !== currentItem[key]) btn.classList.add('wrong');
        }

        btn.onclick = (e) => {
          e.preventDefault();
          e.stopPropagation();
          userAnswers[currentIndex] = opt;
          loadQuestion(false);
        };
        container.appendChild(btn);
      });
    }

    function refreshSpellingUI(val, targetWord) {
      const boxes = document.querySelectorAll('.letter-box');
      boxes.forEach((box, i) => {
        box.classList.remove('active', 'correct', 'wrong');
        box.innerText = val[i] || '';

        if (val.length === targetWord.length) {
          if (val === targetWord) box.classList.add('correct');
          else box.classList.add('wrong');
        } else {
          if (i === val.length) box.classList.add('active');
        }
      });
    }

    function setupSpellingInputListener() {
      const input = document.getElementById('hidden-input');
      if (!input) return;

      input.addEventListener('input', (e) => {
        if (selectedMode !== 'spelling') return;

        const targetWord = quizList[currentIndex].word;
        let val = e.target.value.toLowerCase().replace(/[^a-z]/g, '');

        if (val.length > targetWord.length) val = val.slice(0, targetWord.length);

        e.target.value = val;
        userAnswers[currentIndex] = val;
        refreshSpellingUI(val, targetWord);
      });
    }

    function focusInput() {
      if (selectedMode === 'spelling') {
        const inp = document.getElementById('hidden-input');
        if (inp) {
          inp.focus();
        }
      }
    }

    function speakWord(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'en-US';
        msg.rate = 0.88;
        msg.pitch = 1.0;

        if (dictionaryVoice) {
          msg.voice = dictionaryVoice;
        }

        window.speechSynthesis.speak(msg);
      }
    }

    function prevQuestion() { if (currentIndex > 0) { currentIndex--; loadQuestion(true); } }
    function nextQuestion() { if (currentIndex < quizList.length - 1) { currentIndex++; loadQuestion(true); } }

    function showAnswer() {
      const item = quizList[currentIndex];
      const ansDiv = document.getElementById('answer-display');
      ansDiv.style.display = 'block';

      if (selectedMode === 'sentence') {
        ansDiv.innerHTML = `📌 <b>正確填空：</b> ${item.word}<br>📖 <b>完整翻譯：</b> ${item.sentence_cn}`;
      } else {
        ansDiv.innerHTML = `📌 <b>單詞：</b> ${item.word}<br>📖 <b>中文解釋：</b> ${item.cn}`;
      }
    }

    function calculateScore() {
      let correct = 0;
      quizList.forEach((item, idx) => {
        const ans = userAnswers[idx];
        let isCorrect = false;

        if (selectedMode === 'spelling' || selectedMode === 'sentence') {
          if (ans === item.word) isCorrect = true;
        } else if (selectedMode === 'matching') {
          if (ans === item.cn) isCorrect = true;
        }

        if (isCorrect) {
          correct++;
        } else {
          addMistake(item);
        }
      });
      return Math.round((correct / quizList.length) * 100);
    }

    function finishGame() {
      clearInterval(timerInterval);
      const score = calculateScore();
      const name = document.getElementById('player-name').value.trim();
      const seat = document.getElementById('player-seat').value.trim();
      const groupVal = document.getElementById('group-select').value;
      const modeTextMap = { 'spelling': '聽寫拼字', 'matching': '中文配對', 'sentence': '例句填空' };
      const currentModeText = modeTextMap[selectedMode];

      document.getElementById('result-desc').innerText = `最終得分：${score} 分\n用時：${formatTime(secondsElapsed)}`;
      document.getElementById('result-modal').style.display = 'flex';

      const payload = {
        name: name,
        seat: seat,
        group: groupVal,
        mode: currentModeText,
        score: score,
        time: secondsElapsed,
        timestamp: new Date().toLocaleString()
      };

      const statusElem = document.getElementById('upload-status');
      statusElem.innerText = "正在同步成績至雲端...";

      fetch(GOOGLE_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      })
      .then(() => {
        statusElem.innerText = "✅ 成績已成功上傳至雲端！";
        setTimeout(() => {
          fetchLeaderboard();
        }, 1500);
      })
      .catch((err) => {
        console.error(err);
        statusElem.innerText = "⚠️ 網路原因上傳失敗。";
      });
    }

    function confirmBackToLobby() {
      if (confirm('確定要返回首頁嗎？當前挑戰進度將不會儲存。')) {
        clearInterval(timerInterval);
        backToLobby();
      }
    }

    function backToLobby() {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
      document.getElementById('result-modal').style.display = 'none';
      document.getElementById('game-view').style.display = 'none';
      document.getElementById('lobby-view').style.display = 'block';
      fetchLeaderboard();
      renderMistakes();
    }
  </script>
</body>
</html>
